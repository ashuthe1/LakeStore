// LakeStore wire protocol: the client-facing KV service and the inter-node
// Raft transport, served together on each node's gRPC listener.
syntax = "proto3";

package lakestore;

option go_package = "github.com/ashuthe1/LakeStore/api/pb";

// --- Client-facing KV API ---

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message GetRequest {
  bytes key = 1;
  // Stale reads are served by any node from local state, skipping the
  // leader/linearizability check.
  bool allow_stale = 2;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {}

message ScanRequest {
  bytes start_key = 1;
  uint32 limit = 2; // max pairs to return (server caps this)
}

message ScanResponse {
  repeated KeyValue pairs = 1;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message StatusRequest {}

message StatusResponse {
  uint64 node_id = 1;
  string state = 2; // Follower / Candidate / Leader
  uint64 term = 3;
  uint64 leader_id = 4;
  string leader_addr = 5;
  uint64 commit_index = 6;
  uint64 last_applied = 7;
}

// --- Inter-node Raft transport ---

service RaftTransport {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
  rpc InstallSnapshot(InstallSnapshotArgs) returns (InstallSnapshotReply);
}

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

message RequestVoteArgs {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesArgs {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_term = 3;
  uint64 conflict_index = 4;
}

message InstallSnapshotArgs {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotReply {
  uint64 term = 1;
}
